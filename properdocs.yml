site_name: SMI Framework
site_description: SMI, the Standard Model ITA, is an interchangeable aircraft framework for propeller-airframe integration studies. Open geometry, a Python method package and the data of the papers that used it.
site_url: https://nevesgeovana.github.io/smi/
repo_url: https://github.com/nevesgeovana/smi

theme:
  name: material
  logo: assets/sticker_white.png
  favicon: assets/favicon-white.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

hooks:
  - docs/_hooks/repo_files.py

plugins:
  - search
  - social:
      enabled: !ENV [SMI_SOCIAL_CARDS, true]
      cards_layout_options:
        background_color: "#3c0805"
        color: "#fde3a3"
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [method]
          options:
            docstring_style: numpy
            heading_level: 3
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/nevesgeovana/
      name: LinkedIn
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0009-3055-5529
      name: ORCID
    - icon: fontawesome/brands/github
      link: https://github.com/nevesgeovana
      name: GitHub

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  /_hooks/

nav:
  - Home: index.md
  - Geometry:
      - Overview: geometry/index.md
      - 1st generation: geometry/first-generation.md
  - Method:
      - Overview: method/index.md
      - Method deck: method/deck.md
      - Installation: method/install.md
      - API reference: method/api.md
  - Publications:
      - Papers: publications/index.md
      - 2027 JA SMI-L2: publications/2027-ja-smi-l2.md
  - About the author: about.md
